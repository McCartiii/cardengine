<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Counter — Setup Final</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060609; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif; color: white; }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  @keyframes glow-breathe {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.6; }
  }

  .phone-frame {
    width: 375px;
    height: 812px;
    margin: 30px auto;
    background: #08080e;
    border-radius: 44px;
    border: 3px solid #1a1a25;
    overflow: hidden;
    box-shadow: 0 20px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.03);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
    pointer-events: none;
    animation: glow-breathe 4s ease-in-out infinite;
  }

  .phone-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 56px 20px 20px;
    scrollbar-width: none;
    position: relative;
    z-index: 1;
  }
  .phone-scroll::-webkit-scrollbar { display: none; }

  /* ── Header ── */
  .setup-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .setup-header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: white;
  }

  .setup-header p {
    font-size: 11px;
    color: #333348;
    margin-top: 4px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* ── Sections ── */
  .section {
    margin-bottom: 18px;
  }

  .section-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #2a2a42;
    margin-bottom: 8px;
    padding-left: 2px;
  }

  /* ── Format cards ── */
  .format-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .format-card {
    padding: 14px 0;
    border-radius: 14px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.04);
    background: rgba(255,255,255,0.015);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .format-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 70%);
  }

  .format-card.active::before { opacity: 1; }

  .format-card.active {
    border-color: rgba(124,58,237,0.3);
    box-shadow: 0 0 20px rgba(124,58,237,0.08), 0 4px 12px rgba(0,0,0,0.3);
    transform: translateY(-1px);
  }

  .format-name {
    font-size: 12px;
    font-weight: 700;
    color: #2a2a42;
    transition: color 0.3s;
    position: relative;
  }

  .format-card.active .format-name { color: #c4b5fd; }

  .format-life {
    font-size: 9px;
    color: #1a1a30;
    margin-top: 2px;
    font-weight: 600;
    transition: color 0.3s;
    position: relative;
  }

  .format-card.active .format-life { color: rgba(167,139,250,0.45); }

  /* ── Player count ── */
  .count-row {
    display: flex;
    gap: 6px;
  }

  .count-btn {
    flex: 1;
    padding: 14px 0 10px;
    border-radius: 14px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.04);
    background: rgba(255,255,255,0.015);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .count-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    background: radial-gradient(ellipse at 50% 20%, rgba(59,130,246,0.15) 0%, transparent 70%);
  }

  .count-btn.active::before { opacity: 1; }

  .count-btn.active {
    border-color: rgba(59,130,246,0.3);
    box-shadow: 0 0 20px rgba(59,130,246,0.08), 0 4px 12px rgba(0,0,0,0.3);
    transform: translateY(-1px);
  }

  .count-num {
    font-size: 22px;
    font-weight: 900;
    color: #1e1e32;
    letter-spacing: -0.5px;
    transition: all 0.3s;
    position: relative;
  }

  .count-btn.active .count-num {
    color: #93c5fd;
    text-shadow: 0 0 20px rgba(59,130,246,0.4);
  }

  .count-dots {
    display: flex;
    gap: 3px;
    justify-content: center;
    margin-top: 5px;
  }

  .count-dot-icon {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #1a1a30;
    transition: background 0.3s;
  }

  .count-btn.active .count-dot-icon { background: rgba(59,130,246,0.5); }

  /* ── Player names ── */
  .names-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 3px 6px 3px 14px;
    transition: all 0.25s;
  }

  .name-row:focus-within {
    border-color: rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.025);
    box-shadow: 0 0 16px rgba(0,0,0,0.2);
  }

  .name-dot-wrap {
    position: relative;
    width: 12px; height: 12px;
    flex-shrink: 0;
  }

  .name-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    position: absolute;
    top: 2px; left: 2px;
  }

  .name-dot-ring {
    width: 12px; height: 12px;
    border-radius: 50%;
    position: absolute;
    top: 0; left: 0;
    border: 1px solid;
    opacity: 0.25;
  }

  .name-input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.45);
    outline: none;
    font-family: inherit;
  }

  .name-input::placeholder { color: rgba(255,255,255,0.1); }

  .name-index {
    font-size: 9px;
    font-weight: 700;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    flex-shrink: 0;
  }

  /* ── Timer ── */
  .timer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .timer-chip {
    padding: 12px 0;
    border-radius: 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.04);
    background: rgba(255,255,255,0.015);
    color: #2a2a42;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .timer-chip::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.3s;
    background: radial-gradient(ellipse at 50% 0%, rgba(245,158,11,0.15) 0%, transparent 70%);
  }

  .timer-chip.active::before { opacity: 1; }

  .timer-chip.active {
    border-color: rgba(245,158,11,0.3);
    color: #fbbf24;
    box-shadow: 0 0 18px rgba(245,158,11,0.06);
    transform: translateY(-1px);
    text-shadow: 0 0 12px rgba(245,158,11,0.3);
  }

  .timer-sub {
    font-size: 8px;
    display: block;
    margin-top: 1px;
    opacity: 0.4;
    font-weight: 500;
  }

  .no-timer-row {
    margin-top: 6px;
  }

  .no-timer-chip {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.04);
    background: rgba(255,255,255,0.015);
    color: #222238;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.5px;
  }

  .no-timer-chip.active {
    border-color: rgba(255,255,255,0.08);
    color: #444;
    background: rgba(255,255,255,0.03);
  }

  .timer-summary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    padding: 8px;
    border-radius: 10px;
    background: rgba(245,158,11,0.04);
    border: 1px solid rgba(245,158,11,0.08);
  }

  .timer-summary-text {
    font-size: 11px;
    color: #444;
    font-weight: 500;
  }

  .timer-summary-text span {
    color: #f59e0b;
    font-weight: 800;
  }

  /* ── Start button ── */
  .start-wrap {
    padding: 0 20px 36px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .start-btn {
    width: 100%;
    padding: 18px;
    border-radius: 18px;
    border: none;
    font-size: 16px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 40%, #3b82f6 70%, #06b6d4 100%);
    box-shadow:
      0 4px 24px rgba(124,58,237,0.3),
      0 0 60px rgba(59,130,246,0.1),
      0 1px 0 rgba(255,255,255,0.1) inset;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .start-btn:active {
    transform: scale(0.97);
    box-shadow: 0 2px 16px rgba(124,58,237,0.35);
  }

  .start-shimmer {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 60%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
    animation: shimmer 2.5s ease-in-out infinite;
  }

  .start-text {
    position: relative;
    z-index: 1;
  }

  .bottom-glow {
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 80px;
    background: radial-gradient(ellipse at 50% 100%, rgba(124,58,237,0.1) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="bg-glow"></div>

  <div class="phone-scroll">

    <div class="setup-header">
      <h1>New Game</h1>
      <p>Configure your battle</p>
    </div>

    <!-- Format -->
    <div class="section">
      <div class="section-label">Format</div>
      <div class="format-grid">
        <div class="format-card">
          <div class="format-name">Standard</div>
          <div class="format-life">20 life</div>
        </div>
        <div class="format-card">
          <div class="format-name">Modern</div>
          <div class="format-life">20 life</div>
        </div>
        <div class="format-card active">
          <div class="format-name">Commander</div>
          <div class="format-life">40 life</div>
        </div>
        <div class="format-card">
          <div class="format-name">Brawl</div>
          <div class="format-life">25 life</div>
        </div>
        <div class="format-card">
          <div class="format-name">Legacy</div>
          <div class="format-life">20 life</div>
        </div>
        <div class="format-card">
          <div class="format-name">Vintage</div>
          <div class="format-life">20 life</div>
        </div>
      </div>
    </div>

    <!-- Players -->
    <div class="section">
      <div class="section-label">Players</div>
      <div class="count-row">
        <div class="count-btn">
          <div class="count-num">2</div>
          <div class="count-dots"><div class="count-dot-icon"></div><div class="count-dot-icon"></div></div>
        </div>
        <div class="count-btn">
          <div class="count-num">3</div>
          <div class="count-dots"><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div></div>
        </div>
        <div class="count-btn active">
          <div class="count-num">4</div>
          <div class="count-dots"><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div></div>
        </div>
        <div class="count-btn">
          <div class="count-num">5</div>
          <div class="count-dots"><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div></div>
        </div>
        <div class="count-btn">
          <div class="count-num">6</div>
          <div class="count-dots"><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div><div class="count-dot-icon"></div></div>
        </div>
      </div>
    </div>

    <!-- Names -->
    <div class="section">
      <div class="section-label">Names</div>
      <div class="names-list">
        <div class="name-row">
          <div class="name-dot-wrap">
            <div class="name-dot" style="background:#7c3aed;box-shadow:0 0 8px #7c3aed;"></div>
            <div class="name-dot-ring" style="border-color:#7c3aed;"></div>
          </div>
          <input class="name-input" value="Player 1" />
          <div class="name-index" style="color:#7c3aed44;">1</div>
        </div>
        <div class="name-row">
          <div class="name-dot-wrap">
            <div class="name-dot" style="background:#3b82f6;box-shadow:0 0 8px #3b82f6;"></div>
            <div class="name-dot-ring" style="border-color:#3b82f6;"></div>
          </div>
          <input class="name-input" value="Player 2" />
          <div class="name-index" style="color:#3b82f644;">2</div>
        </div>
        <div class="name-row">
          <div class="name-dot-wrap">
            <div class="name-dot" style="background:#15803d;box-shadow:0 0 8px #15803d;"></div>
            <div class="name-dot-ring" style="border-color:#15803d;"></div>
          </div>
          <input class="name-input" value="Player 3" />
          <div class="name-index" style="color:#15803d44;">3</div>
        </div>
        <div class="name-row">
          <div class="name-dot-wrap">
            <div class="name-dot" style="background:#f59e0b;box-shadow:0 0 8px #f59e0b;"></div>
            <div class="name-dot-ring" style="border-color:#f59e0b;"></div>
          </div>
          <input class="name-input" value="Player 4" />
          <div class="name-index" style="color:#f59e0b44;">4</div>
        </div>
      </div>
    </div>

    <!-- Timer -->
    <div class="section">
      <div class="section-label">Game Clock</div>
      <div class="timer-grid">
        <div class="timer-chip">15<span class="timer-sub">min</span></div>
        <div class="timer-chip">25<span class="timer-sub">min</span></div>
        <div class="timer-chip">30<span class="timer-sub">min</span></div>
        <div class="timer-chip">45<span class="timer-sub">min</span></div>
        <div class="timer-chip active">60<span class="timer-sub">min</span></div>
        <div class="timer-chip">75<span class="timer-sub">min</span></div>
        <div class="timer-chip">90<span class="timer-sub">min</span></div>
        <div class="timer-chip">120<span class="timer-sub">min</span></div>
      </div>
      <div class="no-timer-row">
        <div class="no-timer-chip">No Timer — Casual</div>
      </div>
      <div class="timer-summary">
        <div class="timer-summary-text"><span>15 min</span> per player · <span>60 min</span> total</div>
      </div>
    </div>

  </div>

  <div class="bottom-glow"></div>
  <div class="start-wrap">
    <button class="start-btn">
      <span class="start-shimmer"></span>
      <span class="start-text">Start Game</span>
    </button>
  </div>
</div>

</body>
</html>
